            const [matchLeftList, setMatchLeftList] = React.useState([]);
            const [matchRightList, setMatchRightList] = React.useState([]);
            const [selectedLeft, setSelectedLeft] = React.useState(null);
            const [selectedRight, setSelectedRight] = React.useState(null);
            const [matchedIds, setMatchedIds] = React.useState([]);
            const [mismatchError, setMismatchError] = React.useState(false);

            const playAudio = (text, e, overrideLang = null, rateSpeed = 0.85) => {
                if (e) e.stopPropagation();
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const targetLang = overrideLang || selectedAccent;
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = targetLang;
                    utterance.rate = rateSpeed;

                    const voices = window.speechSynthesis.getVoices();
                    
                    // Priority Search for Enhanced / Siri / Premium foreign voices
                    const matchedVoice = voices.find(v => {
                        const vLang = v.lang.replace('_', '-');
                        const isTarget = vLang === targetLang || vLang.startsWith(targetLang);
                        const isHighQuality = v.name.includes('Enhanced') || v.name.includes('Siri') || v.name.includes('Premium') || v.name.includes('Natural');
                        return isTarget && isHighQuality;
                    }) || voices.find(v => {
                        const vLang = v.lang.replace('_', '-');
                        return vLang === targetLang || vLang.startsWith(targetLang);
                    });

                    if (matchedVoice) {
                        utterance.voice = matchedVoice;
                    }
                    
                    utterance.onstart = () => setIsPlayingAudio(true);
                    utterance.onend = () => setIsPlayingAudio(false);
                    utterance.onerror = () => setIsPlayingAudio(false);
                    
                    window.speechSynthesis.speak(utterance);
                } else {
                    console.warn("Trình duyệt không hỗ trợ Web Speech API.");
                }
            };

            // Prime voices on load
            React.useEffect(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.getVoices();
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.getVoices();
                    };
                }
            }, []);

            const filteredData = React.useMemo(() => {
                return fullVocabularyData.filter(item => {
                    const matchesCategory = filter === 'all' || item.category === filter;
                    const matchesFav = !onlyFavorites || favorites.includes(item.id);
                    const matchesQuery = searchQuery === '' || 
                        item.word.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        item.vietnamese.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        item.chinese.includes(searchQuery) ||
                        (item.collocation && item.collocation.toLowerCase().includes(searchQuery.toLowerCase()));
                    return matchesCategory && matchesFav && matchesQuery;

            React.useEffect(() => {
                setCurrentIndex(0);
                setIsFlipped(false);
                resetQuizState();

            // Setup Matching Game round

                if (filteredData.length === 0) return;
                const pool = [...filteredData].sort(() => 0.5 - Math.random()).slice(0, 6);
                
                const lefts = pool.map(item => ({ id: item.id, word: item.word, ipa: item.ipa }));
                const rights = pool.map(item => ({ id: item.id, meaning: `${item.vietnamese} (${item.chinese})` }));
                
                setMatchLeftList(lefts.sort(() => 0.5 - Math.random()));
                setMatchRightList(rights.sort(() => 0.5 - Math.random()));
                setSelectedLeft(null);
                setSelectedRight(null);
                setMatchedIds([]);
                setMismatchError(false);

                setIsFlipped(false);

                            </div>

                            <div className="mt-4 pt-3 border-t border-slate-100 text-center">
                                <span className="text-[11px] text-slate-400 font-medium">Luyện tập nối từ giúp phản xạ nhận diện nghĩa từ vựng tức thì khi làm bài Reading.</span>
                            </div>
                        </div>
                    )}

                    {/* Navigation Buttons for Flashcards */}
                    {studyMode === 'flashcard' && (
                        <div className="flex items-center gap-5 mt-6">
                            <button 
                                onClick={prevCard}
                                disabled={filteredData.length === 0}
                                className="w-12 h-12 rounded-full bg-white shadow-md border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 active:scale-95 transition-all disabled:opacity-50"
                                title="Thẻ trước"
                            >
                                <i className="fas fa-arrow-left"></i>
                            </button>
                            
                            <button 
                                onClick={() => setIsFlipped(!isFlipped)}
                                className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl font-bold shadow-md transition-all active:scale-95 text-xs uppercase tracking-wider"
                            >
                                {isFlipped ? "Mặt Trước" : "Lật Mặt Sau"}
                            </button>

                            <button 
                                onClick={nextCard}
                                disabled={filteredData.length === 0}
                                className="w-12 h-12 rounded-full bg-white shadow-md border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 active:scale-95 transition-all disabled:opacity-50"
                                title="Thẻ tiếp theo"
                            >
                                <i className="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    )}

                    {/* Tips footer */}
                    <p className="mt-6 text-slate-400 text-xs text-center flex items-center justify-center gap-1.5">
                        <i className="far fa-lightbulb text-amber-400"></i>
                        <span>Bấm vào biểu tượng loa để nghe phát âm giọng Mỹ / Anh chuẩn (Web Speech API).</span>
                    </p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
